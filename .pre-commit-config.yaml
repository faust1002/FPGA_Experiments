repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
  - repo: local
    hooks:
      - id: verilator-lint
        name: Verilator linter
        entry: verilator --lint-only -Wall --quiet
        language: system
        files: \.(v|sv)$
